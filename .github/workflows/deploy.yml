name: Deploy rag_conv

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Update rag_conv + restart api
        run: |
          set -euo pipefail
          echo "$(date -Is) DEPLOY from $GITHUB_REPOSITORY@$GITHUB_SHA" >> /srv/capstone/logs/deploy.log

          cd /srv/capstone/cappie_run/rag_conv
          git fetch --all --prune
          git reset --hard origin/main

          echo "$GITHUB_SHA" > /srv/capstone/cappie_run/rag_conv/.deployed_sha

          docker compose up -d ollama
          docker compose exec ollama ollama pull nomic-embed-text
          docker compose exec ollama ollama pull llama3.1
          docker compose -f /srv/capstone/docker-compose.yml restart api
