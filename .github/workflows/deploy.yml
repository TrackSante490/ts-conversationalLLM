name: Deploy rag_conv

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull Ollama models from server .env and restart api
        shell: bash
        run: |
          set -euo pipefail

          COMPOSE="-f /srv/capstone/docker-compose.yml"
          ENV_FILE="/srv/capstone/.env"

          CHAT_MODEL="$(grep -E '^OLLAMA_CHAT_MODEL=' "$ENV_FILE" | tail -n1 | cut -d= -f2- | tr -d '"')"
          EMBED_MODEL="$(grep -E '^OLLAMA_EMBED_MODEL=' "$ENV_FILE" | tail -n1 | cut -d= -f2- | tr -d '"')"

          if [ -z "${CHAT_MODEL:-}" ] || [ -z "${EMBED_MODEL:-}" ]; then
            echo "Missing OLLAMA_CHAT_MODEL or OLLAMA_EMBED_MODEL in $ENV_FILE"
            exit 1
          fi

          docker compose $COMPOSE up -d ollama
          until docker compose $COMPOSE exec -T ollama ollama list >/dev/null 2>&1; do
            sleep 2
          done

          docker compose $COMPOSE exec -T ollama ollama pull "$CHAT_MODEL"
          docker compose $COMPOSE exec -T ollama ollama pull "$EMBED_MODEL"
          docker compose $COMPOSE restart api
